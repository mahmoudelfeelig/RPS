services:
  rps-web:
    container_name: rps-web
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    networks:
      web:
        aliases:
          - rps-web
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,mode=0750,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,size=4m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  rps-api:
    container_name: rps-api
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"
    networks:
      web:
        aliases:
          - rps-api
    volumes:
      - uploads-data:/data/uploads

networks:
  web:
    external: true

volumes:
  uploads-data:
